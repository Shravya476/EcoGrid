
{% extends "base.html" %}

{% block content %}

<style>
    .cloud-page {
        max-width: 1100px;
        margin: 25px auto;
        padding: 20px;
    }

    .cloud-heading {
        margin-bottom: 22px;
    }

    .cloud-heading h1 {
        font-size: 28px;
        margin-bottom: 8px;
    }

    .cloud-heading p {
        color: var(--text-muted, #888);
        margin: 0;
    }

    .cloud-location {
        padding: 15px 18px;
        border-radius: 12px;
        background: var(--card-bg, #f5f5f5);
        margin-bottom: 20px;
    }

    .cloud-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .cloud-button {
        border: none;
        padding: 12px 20px;
        border-radius: 9px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        background: var(--primary, #16845b);
        color: white;
    }

    .cloud-button.secondary {
        background: #526477;
    }

    .cloud-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .cloud-status {
        padding: 12px;
        border-radius: 9px;
        margin: 15px 0;
        display: none;
        overflow-wrap: anywhere;
    }

    .cloud-status.loading {
        display: block;
        background: #e8f2ff;
        color: #174b80;
    }

    .cloud-status.error {
        display: block;
        background: #ffe9e9;
        color: #a32020;
    }

    .cloud-results {
        margin-top: 22px;
        text-align: center;
    }

    .cloud-percentage {
        display: inline-block;
        padding: 15px 25px;
        margin-bottom: 18px;
        border-radius: 12px;
        background: var(--card-bg, #f5f5f5);
        font-size: 25px;
        font-weight: 700;
    }

    .cloud-image {
        width: 100%;
        max-width: 850px;
        height: auto;
        display: block;
        margin: 0 auto;
        border-radius: 14px;
        border: 1px solid rgba(128,128,128,0.25);
    }

    @media (max-width: 600px) {
        .cloud-page {
            padding: 12px;
        }

        .cloud-heading h1 {
            font-size: 23px;
        }

        .cloud-percentage {
            font-size: 21px;
        }
    }
</style>

<div class="cloud-page">

    <div class="cloud-heading">
        <h1>Cloud Monitoring</h1>
        <p>View satellite imagery and the estimated cloud-covered area.</p>
    </div>

    <div class="cloud-location">
        <strong>Monitoring Location:</strong>
        {{ loc.name }}

        <br>

        <small>
            Latitude: {{ loc.lat }} |
            Longitude: {{ loc.lon }}
        </small>
    </div>

    <div class="cloud-actions">
        <button
            type="button"
            class="cloud-button"
            id="cloudCheckBtn"
            onclick="checkClouds(false)">
            Check Clouds Now
        </button>

        <button
            type="button"
            class="cloud-button secondary"
            id="cloudDemoBtn"
            onclick="checkClouds(true)">
            Load Demo Image
        </button>
    </div>

    <div id="cloudStatus" class="cloud-status"></div>

    <div id="cloudResults" class="cloud-results"></div>

</div>

<script>
async function checkClouds(demo = false) {

    const status = document.getElementById("cloudStatus");
    const results = document.getElementById("cloudResults");

    const normalBtn = document.getElementById("cloudCheckBtn");
    const demoBtn = document.getElementById("cloudDemoBtn");

    normalBtn.disabled = true;
    demoBtn.disabled = true;

    results.replaceChildren();

    status.style.display = "block";
    status.className = "cloud-status loading";
    status.textContent = "Fetching satellite cloud image. Please wait...";

    try {

        let url = "{{ url_for('api_cloud') }}";

        if (demo) {
            url += "?demo=1";
        }

        const response = await fetch(url, {
            method: "GET",
            headers: {
                "Accept": "application/json"
            },
            credentials: "same-origin",
            cache: "no-store"
        });

        // Read the response as text first.
        // This prevents JSON parsing errors when Flask returns HTML.
        const responseText = await response.text();

        let data;

        try {
            data = JSON.parse(responseText);
        } catch (parseError) {

            if (
                response.redirected ||
                response.url.includes("/login")
            ) {
                throw new Error(
                    "Your login session may have expired. Please log in again."
                );
            }

            console.error(
                "Server returned HTML instead of JSON:",
                responseText
            );

            throw new Error(
                "The cloud API returned an HTML page instead of JSON. HTTP status: " +
                response.status +
                ". Please check the Render logs."
            );
        }

        if (!response.ok || data.ok === false) {
            throw new Error(
                data.message || "Unable to retrieve cloud information."
            );
        }

        // Get the latest cloudy percentage.
        const percentages = data.cloud_share;

        if (
            !Array.isArray(percentages) ||
            percentages.length === 0
        ) {
            throw new Error("Cloud percentage is unavailable.");
        }

        const latestPercentage =
            percentages[percentages.length - 1];

        // Check satellite image.
        if (!data.image) {
            throw new Error("Satellite image is unavailable.");
        }

        // Display cloudy percentage.
        const percentageBox = document.createElement("div");

        percentageBox.className = "cloud-percentage";

        percentageBox.textContent =
            "☁ Cloudy Area: " + latestPercentage + "%";

        results.appendChild(percentageBox);

        // Display actual satellite image.
        const image = document.createElement("img");

        image.className = "cloud-image";

        image.alt = "Satellite image showing cloud conditions";

        image.src = data.image.startsWith("data:image/")
            ? data.image
            : "data:image/png;base64," + data.image;

        image.onerror = function () {
            image.remove();

            status.style.display = "block";
            status.className = "cloud-status error";
            status.textContent =
                "The satellite image could not be displayed.";
        };

        results.appendChild(image);

        // Hide status after successful display.
        status.textContent = "";
        status.style.display = "none";

    } catch (error) {

        console.error("Cloud Monitoring Error:", error);

        status.style.display = "block";
        status.className = "cloud-status error";
        status.textContent = error.message;

    } finally {

        normalBtn.disabled = false;
        demoBtn.disabled = false;

    }
}
</script>

{% endblock %}
